camera:
  index: 0
  width: 640
  height: 480
  fps: 60
gesture:
  max_hands: 2
  fist_hold_seconds: 0.15
  pinch_hold_seconds: 0.15
  palm_pause_hold_seconds: 0.8
  pause_cooldown_seconds: 0.8
  deadzone: 0.015
  scroll_sensitivity: 1800.0
  volume_sensitivity: 0.08
command:
  scroll_hz: 30.0
  volume_hz: 10.0
debug:
  overlay_enabled: true
  log_file: gesture-control.log
